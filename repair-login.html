<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Repairing SarNi sign-in</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef5ff,#f7f3ff);color:#233052;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(440px,100%);padding:28px;border:1px solid #d9e2f2;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(43,57,108,.14);text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#356de8,#8255df);font-size:28px;font-weight:900}
    h1{margin:0;font-size:24px}p{margin:10px 0 0;color:#68758e;line-height:1.55}.status{margin-top:18px;padding:12px;border-radius:12px;color:#245b4d;background:#eaf9f2;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="mark">₹</div>
    <h1>Repairing sign-in</h1>
    <p>Removing only the old browser session and app cache. Your portfolio data, saved username, diary drafts and display preferences are preserved.</p>
    <div class="status" id="status">Please wait a moment…</div>
  </main>
  <script>
    (function(){
      var build='20260827-19422-signout1';
      try{
        ['portfolio_token','portfolio_username','myfinance_last_activity_at','myfinance_last_hidden_at'].forEach(function(key){localStorage.removeItem(key);});
        localStorage.setItem('myfinance_current_build_id',build);
        localStorage.setItem('myfinance_browser_repaired_notice','1');
      }catch(e){}

      var tasks=[];
      if('caches' in window){
        tasks.push(caches.keys().then(function(keys){
          return Promise.all(keys.filter(function(key){return /myfinance|sarni|portfolio/i.test(String(key));}).map(function(key){return caches.delete(key);}));
        }).catch(function(){}));
      }
      if('serviceWorker' in navigator){
        tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
          var currentPath=location.pathname.replace(/[^/]*$/,'');
          return Promise.all(regs.map(function(reg){
            try{return new URL(reg.scope).pathname.startsWith(currentPath)?reg.unregister():Promise.resolve(false);}catch(e){return Promise.resolve(false);}
          }));
        }).catch(function(){}));
      }

      var go=function(){
        document.getElementById('status').textContent='Repair complete · opening SarNi…';
        setTimeout(function(){location.replace('./?v=19422-signout1&repaired='+Date.now());},250);
      };
      Promise.race([Promise.all(tasks),new Promise(function(resolve){setTimeout(resolve,2200);})]).then(go,go);
    })();
  </script>
</body>
</html>
